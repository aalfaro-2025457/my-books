<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookEcho - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/main/resources/static/styles/style.css">
</head>
<body class="auth-page bg-slate-950 flex items-center justify-center min-h-screen">

<main class="auth-card bg-slate-900 p-8 rounded-xl shadow-2xl border border-slate-800 w-full max-w-md">
    <header class="auth-card__header mb-8 text-center">
        <h1 class="auth-card__logo text-3xl font-bold text-blue-500 mb-2">BookEcho</h1>
        <p class="auth-card__subtitle text-slate-400">Welcome back, collector</p>
    </header>

    <p th:if="${error}" th:text="${error}" class="text-red-400 text-sm mb-4 text-center bg-red-400/10 py-2 rounded"></p>

    <form th:action="@{/login}" method="post" class="auth-form flex flex-col gap-5">
        <div class="auth-form__group flex flex-col gap-2">
            <label class="auth-form__label text-sm font-medium text-slate-300">Username</label>
            <input type="text" name="username"
                   class="auth-form__input bg-slate-800 border border-slate-700 rounded-lg p-3 text-slate-100 focus:ring-2 focus:ring-blue-500 outline-none transition"
                   required>
        </div>

        <div class="auth-form__group flex flex-col gap-2">
            <label class="auth-form__label text-sm font-medium text-slate-300">Password</label>
            <input type="password" name="password"
                   class="auth-form__input bg-slate-800 border border-slate-700 rounded-lg p-3 text-slate-100 focus:ring-2 focus:ring-blue-500 outline-none transition"
                   required>
        </div>

        <button type="submit" class="auth-form__submit bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-transform active:scale-95">
            Sign In
        </button>
    </form>

    <footer class="auth-card__footer mt-8 text-center border-t border-slate-800 pt-6">
        <p class="text-slate-500 text-sm">
            New here?
            <a href="/register" class="text-blue-400 hover:underline">Create an account</a>
        </p>
    </footer>
</main>

</body>
</html>

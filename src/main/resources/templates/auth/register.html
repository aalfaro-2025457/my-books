<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookEcho - Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/main/resources/static/styles/style.css">
</head>
<body class="auth-page bg-slate-950 flex items-center justify-center min-height-screen py-20">

<main class="auth-card bg-slate-900 p-8 rounded-xl shadow-2xl border border-slate-800 w-full max-w-md">
    <header class="auth-card__header mb-8 text-center">
        <h1 class="auth-card__logo text-3xl font-bold text-blue-500 mb-2">BookEcho</h1>
        <p class="auth-card__subtitle text-slate-400">Join our community of readers</p>
    </header>

    <form th:action="@{/register}" th:object="${user}" method="post" class="auth-form flex flex-col gap-5">

        <div class="auth-form__group flex flex-col gap-2">
            <label for="username" class="auth-form__label text-sm font-medium text-slate-300">Username</label>
            <input type="text"
                   th:field="*{username}"
                   id="username"
                   class="auth-form__input bg-slate-800 border border-slate-700 rounded-lg p-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                   placeholder="Choose a username"
                   required>
        </div>

        <div class="auth-form__group flex flex-col gap-2">
            <label for="password" class="auth-form__label text-sm font-medium text-slate-300">Password</label>
            <input type="password"
                   th:field="*{password}"
                   id="password"
                   class="auth-form__input bg-slate-800 border border-slate-700 rounded-lg p-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                   placeholder="••••••••"
                   required>
        </div>

        <button type="submit" class="auth-form__submit bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-all transform hover:scale-[1.02]">
            Create Account
        </button>
    </form>

    <footer class="auth-card__footer mt-8 text-center">
        <p class="text-slate-500 text-sm">
            Already have an account?
            <a href="/login" class="text-blue-400 hover:underline">Login here</a>
        </p>
    </footer>
</main>

<script src="/js/main.js"></script>
</body>
</html>
